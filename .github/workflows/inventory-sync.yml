name: Update Shopify Inventory

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simula senza modificare Shopify"
        type: boolean
        default: true

concurrency:
  group: inventory-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run test:inventory
      - name: Sincronizza inventario
        run: npm run sync -- ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          AUTOFANTASY_WEBSERVICE_KEY: ${{ secrets.AUTOFANTASY_WEBSERVICE_KEY }}
          AUTOFANTASY_SHOP_ID: ${{ vars.AUTOFANTASY_SHOP_ID }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          DEFAULT_LOCATION_ID: ${{ secrets.DEFAULT_LOCATION_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
