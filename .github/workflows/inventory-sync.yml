name: Update Shopify Inventory


on:

  schedule:
    - cron: "*/30 * * * *"

  workflow_dispatch:


jobs:

  sync:

    runs-on: ubuntu-latest


    steps:

      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4

        with:
          node-version: 20


      - run: npm install


      - run: npm run sync

        env:
          SHOPIFY_TOKEN:
            ${{ secrets.SHOPIFY_TOKEN }}

          SHOPIFY_STORE:
            ${{ secrets.SHOPIFY_STORE }}

          SHOPIFY_LOCATION:
            ${{ secrets.SHOPIFY_LOCATION }}