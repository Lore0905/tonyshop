name: Update Shopify Inventory

on:
  schedule:
    - cron: "0 * * * *"  # ogni giorno alle 9:00 italiane
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout codice
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4

      - name: Installa dipendenze
        run: npm install

      - name: Esegui sync inventario
        id: sync
        continue-on-error: true
        run: npm run sync
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_SHOP_DOMAIN: ${{ secrets.SHOPIFY_SHOP_DOMAIN }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}

      - name: Notifica Telegram — SUCCESSO
        if: steps.sync.outcome == 'success'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=✅ *Sync Tonishop completata*%0A%0A📦 Inventario aggiornato con successo.%0A⏰ $(date +'%d/%m %H:%M')%0A%0A[🔗 Vedi log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      - name: Notifica Telegram — ERRORE
        if: steps.sync.outcome == 'failure'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d "parse_mode=Markdown" \
            -d "text=❌ *Sync Tonishop FALLITA*%0A%0A⚠️ Controlla il log per gli errori.%0A⏰ $(date +'%d/%m %H:%M')%0A%0A[🔗 Vedi log](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"