<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Prodotti</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            padding: 30px 15px;
        }
        
        .container { max-width: 1200px; margin: 0 auto; }
        
        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 8px;
            font-size: 2rem;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        
        .toolbar {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .btn-save {
            background: #2563eb;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-save:hover { background: #1d4ed8; transform: translateY(-1px); }
        .btn-save:disabled { background: #9ca3af; cursor: not-allowed; }
        .btn-save.saved { background: #059669; }
        
        .status {
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 20px;
            font-weight: 500;
        }
        
        .status.ok { background: #d1fae5; color: #065f46; }
        .status.warn { background: #fef3c7; color: #92400e; }
        .status.error { background: #fee2e2; color: #991b1b; }
        
        /* ─── FILTRI ─── */
        .filters-bar {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: flex-end;
        }
        
        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
            min-width: 180px;
        }
        
        .filter-group label {
            font-size: 0.8rem;
            font-weight: 600;
            color: #4b5563;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .filter-group select,
        .filter-group input {
            padding: 10px 12px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            background: #f9fafb;
            transition: border-color 0.2s;
        }
        
        .filter-group select:focus,
        .filter-group input:focus {
            outline: none;
            border-color: #2563eb;
            background: white;
        }
        
        .price-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .price-inputs input {
            width: 100%;
        }
        
        .price-inputs span {
            color: #9ca3af;
            font-size: 0.9rem;
        }
        
        .btn-reset {
            background: #f3f4f6;
            color: #374151;
            border: 1px solid #d1d5db;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            height: fit-content;
        }
        
        .btn-reset:hover { background: #e5e7eb; }
        
        .btn-delete-all {
            background: #dc2626;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 700;
            transition: all 0.2s;
            height: fit-content;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .btn-delete-all:hover { background: #b91c1c; transform: translateY(-1px); }
        .btn-delete-all:disabled { background: #fca5a5; cursor: not-allowed; }
        
        .results-count {
            width: 100%;
            font-size: 0.85rem;
            color: #6b7280;
            margin-top: -5px;
        }
        
        /* ─── GRIGLIA ─── */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 25px;
        }
        
        .card {
            background: white;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        
        .card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        
        .card.deleted {
            opacity: 0.75;
            box-shadow: 0 4px 6px -1px rgba(239, 68, 68, 0.2);
        }
        
        .card.deleted::after {
            content: "DA ELIMINARE";
            position: absolute;
            top: 15px;
            right: -30px;
            background: #ef4444;
            color: white;
            padding: 4px 35px;
            font-size: 0.7rem;
            font-weight: 800;
            transform: rotate(45deg);
            letter-spacing: 1px;
            z-index: 10;
        }
        
        .card-header {
            padding: 18px 18px 12px;
            background: #fafafa;
            border-bottom: 1px solid #eee;
        }
        
        .reference {
            display: inline-block;
            background: #374151;
            color: white;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 6px;
        }
        
        .product-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: #111827;
            line-height: 1.3;
        }
        
        .card-image {
            width: 100%;
            height: 220px;
            object-fit: cover;
            border-bottom: 1px solid #eee;
            background: #f3f4f6;
        }
        
        .card-body {
            padding: 18px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: #9ca3af;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .categories-list {
            list-style: none;
            padding: 0;
        }
        
        .categories-list li {
            padding: 3px 0;
            color: #4b5563;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
        }
        
        .categories-list li::before {
            content: "●";
            color: #2563eb;
            font-size: 0.6rem;
            margin-right: 10px;
        }
        
        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-top: 1px solid #f3f4f6;
        }
        
        .info-label { font-size: 0.85rem; color: #6b7280; font-weight: 500; }
        .price { font-size: 1.4rem; color: #059669; font-weight: 800; }
        .quantity { font-size: 1rem; color: #1f2937; font-weight: 700; }
        
        .card-footer {
            padding: 15px;
            display: flex;
            gap: 10px;
            background: #fafafa;
            border-top: 1px solid #eee;
        }
        
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .btn-keep { background: #10b981; color: white; }
        .btn-keep:hover { background: #059669; }
        
        .btn-delete { background: #ef4444; color: white; }
        .btn-delete:hover { background: #dc2626; }
        .btn-delete.active { background: #6b7280; }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #6b7280;
            font-size: 1.1rem;
            grid-column: 1 / -1;
        }
        
        .error-box {
            background: #fee2e2;
            color: #991b1b;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            grid-column: 1 / -1;
        }
        
        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #6b7280;
            grid-column: 1 / -1;
            font-size: 1.1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📦 Catalogo Prodotti</h1>
        <p class="subtitle">Dati caricati da <code>data.json</code> — usa i filtri per cercare rapidamente</p>
        
        <div class="toolbar">
            <button class="btn-save" id="btnSave" onclick="saveToFile()">
                💾 Salva su data.json
            </button>
            <div class="status ok" id="statusMsg">Caricamento in corso...</div>
        </div>

        <!-- FILTRI -->
        <div class="filters-bar" id="filtersBar" style="display:none;">
            <div class="filter-group">
                <label for="filterCategory">Categoria</label>
                <select id="filterCategory" onchange="applyFilters()">
                    <option value="">Tutte le categorie</option>
                </select>
            </div>
            
            <div class="filter-group">
                <label>Prezzo (IVA incl.)</label>
                <div class="price-inputs">
                    <input type="number" id="filterPriceMin" placeholder="Min €" min="0" step="0.01" oninput="applyFilters()">
                    <span>—</span>
                    <input type="number" id="filterPriceMax" placeholder="Max €" min="0" step="0.01" oninput="applyFilters()">
                </div>
            </div>
            
            <button class="btn-reset" onclick="resetFilters()">↺ Reset</button>
            
            <button class="btn-delete-all" id="btnDeleteAll" onclick="deleteAllFiltered()">
                🗑 Elimina tutti
            </button>
            
            <div class="results-count" id="resultsCount"></div>
        </div>

        <div class="grid" id="productGrid">
            <div class="loading">Caricamento prodotti...</div>
        </div>
    </div>

    <script>
        let products = [];
        let filteredProducts = [];
        let fileHandle = null;
        const STORAGE_KEY = 'product_data_cache';

        // ─── Caricamento dati ───
        async function loadData() {
            const cached = localStorage.getItem(STORAGE_KEY);
            if (cached) {
                try {
                    products = JSON.parse(cached);
                    initFilters();
                    applyFilters();
                    setStatus('Dati ripristinati da cache locale', 'ok');
                    return;
                } catch(e) { localStorage.removeItem(STORAGE_KEY); }
            }

            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('HTTP ' + response.status);
                products = await response.json();
                saveToCache();
                initFilters();
                applyFilters();
                setStatus('File data.json caricato correttamente', 'ok');
            } catch (err) {
                console.error('Errore caricamento:', err);
                document.getElementById('productGrid').innerHTML = `
                    <div class="error-box">
                        <p>❌ Impossibile caricare <b>data.json</b></p>
                        <p style="font-size:0.9rem; margin-top:8px;">Assicurati che il file sia nella stessa cartella di questa pagina.</p>
                        <p style="font-size:0.85rem; margin-top:8px; color:#b91c1c;">Errore: ${err.message}</p>
                        <p style="font-size:0.8rem; margin-top:12px; color:#7f1d1d;">
                            💡 Se stai aprendo il file con doppio click, prova invece a usare un server locale.<br>
                            Ad esempio: <code>npx serve</code> o <code>python -m http.server</code>
                        </p>
                    </div>
                `;
                setStatus('Errore caricamento data.json', 'error');
            }
        }

        // ─── Filtri ───
        function getAllCategories() {
            const set = new Set();
            products.forEach(p => {
                const cats = getCategories(p["Nomi delle categorie (x,y,z...)"]);
                cats.forEach(c => set.add(c));
            });
            return Array.from(set).sort();
        }

        function getCategories(str) {
            if (!str) return [];
            return str.split(',').map(c => c.trim()).filter(c => c);
        }

        function initFilters() {
            const select = document.getElementById('filterCategory');
            const categories = getAllCategories();
            
            select.innerHTML = '<option value="">Tutte le categorie</option>';
            
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat;
                select.appendChild(opt);
            });
            
            const prices = products.map(p => p["Prezzo (Tasse Incluse)"] || 0);
            const minPrice = Math.floor(Math.min(...prices));
            const maxPrice = Math.ceil(Math.max(...prices));
            
            document.getElementById('filterPriceMin').placeholder = `Min (${minPrice}€)`;
            document.getElementById('filterPriceMax').placeholder = `Max (${maxPrice}€)`;
            
            document.getElementById('filtersBar').style.display = 'flex';
        }

        function applyFilters() {
            const catFilter = document.getElementById('filterCategory').value;
            const minPrice = parseFloat(document.getElementById('filterPriceMin').value) || 0;
            const maxPrice = parseFloat(document.getElementById('filterPriceMax').value) || Infinity;

            filteredProducts = products.filter(p => {
                if (catFilter) {
                    const cats = getCategories(p["Nomi delle categorie (x,y,z...)"]);
                    if (!cats.includes(catFilter)) return false;
                }
                
                const price = p["Prezzo (Tasse Incluse)"] || 0;
                if (price < minPrice || price > maxPrice) return false;
                
                return true;
            });

            renderCards();
            updateResultsCount();
            updateDeleteAllButton();
        }

        function resetFilters() {
            document.getElementById('filterCategory').value = '';
            document.getElementById('filterPriceMin').value = '';
            document.getElementById('filterPriceMax').value = '';
            applyFilters();
        }

        function updateResultsCount() {
            const total = products.length;
            const showing = filteredProducts.length;
            const el = document.getElementById('resultsCount');
            
            if (showing === total) {
                el.textContent = `Visualizzati tutti i ${total} prodotti`;
            } else {
                el.textContent = `Visualizzati ${showing} di ${total} prodotti`;
            }
        }

        function updateDeleteAllButton() {
            const btn = document.getElementById('btnDeleteAll');
            const visible = filteredProducts.length;
            const alreadyDeleted = filteredProducts.filter(p => p.toDelete === true).length;
            
            if (visible === 0 || visible === alreadyDeleted) {
                btn.disabled = true;
                btn.innerHTML = '🗑 Elimina tutti';
            } else {
                btn.disabled = false;
                btn.innerHTML = `🗑 Elimina tutti (${visible - alreadyDeleted})`;
            }
        }

        // ─── Elimina tutti filtrati ───
        async function deleteAllFiltered() {
            const toDeleteCount = filteredProducts.filter(p => p.toDelete !== true).length;
            
            if (toDeleteCount === 0) return;
            
            const confirmed = confirm(
                `Sei sicuro di voler marcare come "da eliminare" ${toDeleteCount} prodotti?`
            );
            
            if (!confirmed) return;
            
            let deletedCount = 0;
            filteredProducts.forEach(p => {
                if (p.toDelete !== true) {
                    p.toDelete = true;
                    deletedCount++;
                }
            });
            
            saveToCache();
            applyFilters();
            
            setStatus(`✅ ${deletedCount} prodotti marcati come da eliminare`, 'warn');
            
            // Auto-salva
            if (fileHandle || !('showSaveFilePicker' in window)) {
                if (!('showSaveFilePicker' in window)) {
                    autoDownload();
                } else if (fileHandle) {
                    await writeFile();
                }
            }
        }

        // ─── Persistenza ───
        function saveToCache() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(products));
        }

        // ─── Rendering ───
        function formatPrice(price) {
            return new Intl.NumberFormat('it-IT', {
                style: 'currency', currency: 'EUR'
            }).format(price || 0);
        }

        function renderCards() {
            const grid = document.getElementById('productGrid');
            grid.innerHTML = '';

            if (filteredProducts.length === 0) {
                grid.innerHTML = '<div class="no-results">Nessun prodotto corrisponde ai filtri selezionati.</div>';
                return;
            }

            filteredProducts.forEach(product => {
                const isDeleted = product.toDelete === true;
                const cats = getCategories(product["Nomi delle categorie (x,y,z...)"]);
                
                const card = document.createElement('div');
                card.className = `card ${isDeleted ? 'deleted' : ''}`;
                
                card.innerHTML = `
                    <div class="card-header">
                        <span class="reference">${product["Riferimento"] || 'N/D'}</span>
                        <div class="product-name">${product["Nome"]}</div>
                    </div>
                    <img src="${product["URL immagine di copertina"] || ''}" 
                         alt="${product["Nome"]}" 
                         class="card-image"
                         onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22220%22%3E%3Crect width=%22400%22 height=%22220%22 fill=%22%23f3f4f6%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 fill=%22%239ca3af%22 font-size=%2216%22 font-family=%22sans-serif%22%3ENessuna immagine%3C/text%3E%3C/svg%3E'">
                    <div class="card-body">
                        <div>
                            <div class="section-title">Categorie</div>
                            <ul class="categories-list">
                                ${cats.length ? cats.map(c => `<li>${c}</li>`).join('') : '<li style="color:#9ca3af;">Nessuna categoria</li>'}
                            </ul>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Prezzo (IVA incl.)</span>
                            <span class="price">${formatPrice(product["Prezzo (Tasse Incluse)"])}</span>
                        </div>
                        <div class="info-row">
                            <span class="info-label">Quantità</span>
                            <span class="quantity">${product["Quantità"] !== undefined ? product["Quantità"] : '-'}</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <button class="btn btn-keep" onclick="keepProduct(this)">✓ Mantieni</button>
                        <button class="btn btn-delete ${isDeleted ? 'active' : ''}" onclick="toggleDelete(${product["Codice prodotto"]}, this)">
                            ${isDeleted ? '↩ Annulla' : '✕ Elimina'}
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // ─── Azioni singola card ───
        function keepProduct(btn) {
            const original = btn.innerHTML;
            btn.innerHTML = '✓ Mantenuto';
            btn.style.background = '#059669';
            setTimeout(() => {
                btn.innerHTML = original;
                btn.style.background = '';
            }, 800);
        }

        async function toggleDelete(productId, btn) {
            const product = products.find(p => p["Codice prodotto"] === productId);
            if (!product) return;

            if (product.toDelete === true) {
                delete product.toDelete;
            } else {
                product.toDelete = true;
            }

            saveToCache();
            applyFilters();
            
            if (fileHandle || !('showSaveFilePicker' in window)) {
                if (!('showSaveFilePicker' in window)) {
                    autoDownload();
                } else if (fileHandle) {
                    await writeFile();
                }
            }
        }

        // ─── Salvataggio file ───
        async function saveToFile() {
            if (!('showSaveFilePicker' in window)) {
                autoDownload();
                return;
            }

            try {
                if (!fileHandle) {
                    fileHandle = await window.showSaveFilePicker({
                        suggestedName: 'data.json',
                        types: [{
                            description: 'JSON Files',
                            accept: { 'application/json': ['.json'] }
                        }]
                    });
                }
                await writeFile();
                setStatus('✅ File data.json aggiornato!', 'ok');
                document.getElementById('btnSave').classList.add('saved');
                setTimeout(() => document.getElementById('btnSave').classList.remove('saved'), 2000);
            } catch (err) {
                if (err.name !== 'AbortError') {
                    console.error(err);
                    setStatus('Errore nel salvataggio', 'error');
                }
            }
        }

        async function writeFile() {
            if (!fileHandle) return;
            const writable = await fileHandle.createWritable();
            await writable.write(JSON.stringify(products, null, 2));
            await writable.close();
        }

        function autoDownload() {
            const blob = new Blob([JSON.stringify(products, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'data.json';
            a.click();
            URL.revokeObjectURL(url);
            setStatus('📥 Download automatico di data.json avviato', 'warn');
        }

        function setStatus(msg, type) {
            const el = document.getElementById('statusMsg');
            el.textContent = msg;
            el.className = 'status ' + type;
        }

        // ─── Avvio ───
        loadData();
    </script>
</body>
</html>
