<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product Image Studio</title><link rel="stylesheet" href="/static/styles.css"></head><body>
<header class="topbar"><div><p class="eyebrow">SHOPIFY / OPERATIONS</p><h1>Product Image Studio</h1></div><div class="header-actions"><button id="process-unprocessed-button" class="button button-muted">Processa prodotti da modificare</button><button id="sync-button" class="button button-primary">Sincronizza prodotti</button></div></header><main><section id="notice" class="notice">Catalogo locale pronto.</section><section id="queue-summary" class="queue-summary"></section><section class="toolbar" aria-label="Filtri prodotti"><div class="toolbar-heading"><span>Filtri</span><span id="filter-count"></span></div><div class="filter-groups"><div><p class="filter-label">Stato operativo</p><div id="status-filter" class="status-filter" role="group"><label><input type="checkbox" value="to_modify"> Da modificare</label><label><input type="checkbox" value="modified"> Modificata</label><label><input type="checkbox" value="uploaded"> Caricata</label><label><input type="checkbox" value="ok"> OK</label></div></div><div><p class="filter-label">Stato Shopify</p><div id="shopify-filter" class="status-filter" role="group"><label><input type="checkbox" value="active"> Attivo</label><label><input type="checkbox" value="draft"> Bozza</label><label><input type="checkbox" value="archived"> Archiviato</label></div></div></div></section><section id="product-grid" class="product-grid" aria-live="polite"></section></main>
<dialog id="photo-modal"><div class="modal-heading"><div><p class="eyebrow">FOTO PRODOTTO</p><h2 id="modal-title"></h2></div><button class="icon-button" id="close-modal" aria-label="Chiudi">×</button></div><div id="modal-grid" class="photo-grid"></div></dialog>
<template id="product-template"><article class="product-card"><button class="image-comparison open-photos" aria-label="Apri le foto del prodotto"><img class="original-image" alt="Foto originale"><img class="processed-image" alt="Foto elaborata"><span class="empty-image">Nessuna foto</span><span class="comparison-hint">Tieni il mouse qui per l'originale</span></button><div class="card-content"><div class="card-meta"><p class="product-id"></p><span class="status-badge"></span></div><h2></h2><p class="counter"></p><label class="status-control"><span>Stato Shopify</span><span class="select-wrap"><select class="shopify-status"><option value="active">Attivo</option><option value="draft">Bozza</option><option value="archived">Archiviato</option></select></span></label><div class="actions"><button class="button button-muted process-all">Processa foto</button><button class="button button-primary upload-all">Carica foto</button><button class="button button-muted mark-ok">OK</button></div><button class="button button-save save-status" disabled>Carica modifiche</button></div></article></template>
<template id="photo-template"><article class="photo-card"><div class="image-comparison"><img class="original-image" alt="Foto originale"><img class="processed-image" alt="Foto elaborata"><span class="empty-image">Nessuna anteprima</span><span class="photo-state"></span><span class="photo-upload-badge">Caricata su Shopify</span><span class="comparison-hint">Originale</span></div><p class="photo-error"></p><div class="actions"><button class="button button-muted process-button">Processa</button><button class="button button-primary upload-button">Carica</button></div></article></template><script src="/static/app.js"></script></body></html>
