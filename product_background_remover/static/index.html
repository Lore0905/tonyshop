<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Product Background Remover</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header>
      <div><p class="eyebrow">SHOPIFY · LOCALE</p><h1>Product Background Remover</h1></div>
      <button id="sync-button" class="primary">↻ Sincronizza prodotti</button>
    </header>
    <main>
      <section id="notice" class="notice">Configura <code>.env</code>, poi sincronizza il catalogo Shopify.</section>
      <section id="queue-summary" class="queue-summary"></section>
      <section id="product-grid" class="product-grid" aria-live="polite"></section>
    </main>
    <dialog id="photo-modal"><div class="modal-heading"><div><p class="eyebrow">FOTO PRODOTTO</p><h2 id="modal-title"></h2></div><button class="icon-button" id="close-modal" aria-label="Chiudi">×</button></div><div id="modal-grid" class="photo-grid"></div></dialog>
    <template id="product-template">
      <article class="product-card">
        <div class="image-comparison"><img class="product-image" alt=""><span class="empty-image">Nessuna foto</span><span class="comparison-hint">Passa il mouse per l'originale</span></div>
        <div class="card-content"><div class="title-line"><h2></h2><span class="status-badge"></span></div><p class="counter"></p><div class="actions"><button class="secondary view-button">Visualizza foto</button><button class="secondary process-all">Processa tutte</button><button class="primary upload-all">Carica tutte</button></div></div>
      </article>
    </template>
    <template id="photo-template">
      <article class="photo-card"><div class="image-comparison"><img class="photo-image" alt=""><span class="empty-image">Nessuna anteprima</span><span class="photo-state"></span></div><p class="photo-error"></p><div class="actions"><button class="secondary process-button">Processa</button><button class="primary upload-button">Carica</button></div></article>
    </template>
    <script src="/static/app.js"></script>
  </body>
</html>
